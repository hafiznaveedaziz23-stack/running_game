<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUNNING RUSH 3D - Bali</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0b3d91;overflow:hidden;touch-action:none}
canvas{display:block}
#game{position:fixed;inset:0}
#hud{position:fixed;top:0;left:0;right:0;padding:10px;display:none;justify-content:space-between;z-index:10}
.pill{background:rgba(0,0,0,.65);color:#fff;padding:8px 14px;border-radius:20px;font-weight:900}
.pill span{color:#FFD700}
#controls{position:fixed;bottom:14px;left:0;right:0;display:none;justify-content:center;gap:10px;z-index:10}
#controls button{width:62px;height:62px;border-radius:50%;border:none;background:#fff;font-size:24px;box-shadow:0 5px 15px rgba(0,0,0,.4)}
#controls button:active{background:#FFD700}
#jumpBtn{width:76px!important;height:76px!important;background:#FFD700!important}
#msg{position:fixed;top:35%;left:0;right:0;text-align:center;color:#fff;font-size:28px;font-weight:900;text-shadow:0 4px 20px #000;z-index:15;display:none}
/* LOADING */
#loading{position:fixed;inset:0;background:#0b3d91;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;color:#fff}
#loading h1{font-size:52px;text-align:center;line-height:.85;text-shadow:0 6px 0 #c0392b,0 10px 20px rgba(0,0,0,.5);transform:rotate(-3deg)}
#loading h1 span{color:#FFD700}
#bar{width:280px;height:22px;background:#000;border-radius:20px;margin-top:20px;overflow:hidden;border:3px solid #fff}
#fill{height:100%;width:0%;background:#ff5722;transition:.2s}
#loadPct{margin-top:8px;font-weight:900}
/* MENU */
#menu{position:fixed;inset:0;background:linear-gradient(180deg,#ff9a3d,#ff6b6b,#7b2ff7);display:none;flex-direction:column;align-items:center;justify-content:flex-end;z-index:20;color:#fff;padding-bottom:16px}
#menuTop{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between}
.topBtn{background:rgba(0,0,0,.4);color:#fff;border:none;padding:8px 12px;border-radius:20px;font-weight:800}
#hero{position:absolute;top:18%;text-align:center}
#hero h2{font-size:52px;line-height:.85;text-shadow:0 6px 0 #c0392b;transform:rotate(-2deg)}
#hero h2 span{color:#FFD700}
#hero p{font-size:18px;font-weight:800;margin-top:6px}
#playerFig{font-size:110px;margin-top:10px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#press{font-size:26px;font-weight:900;background:#fff;color:#000;padding:12px 28px;border-radius:50px;margin:10px 0;box-shadow:0 8px 20px rgba(0,0,0,.4);cursor:pointer}
#bottomBar{display:flex;gap:10px;width:100%;max-width:380px;padding:0 12px}
#bottomBar button{flex:1;padding:12px 6px;border-radius:16px;border:none;font-weight:900;font-size:14px;cursor:pointer}
#topRun{background:#2ecc71;color:#fff} #meBtn{background:#3498db;color:#fff} #shopBtn{background:#e67e22;color:#fff}
/* NOTEBOOK */
.note{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.paper{background:#fdf6e3;width:100%;max-width:380px;max-height:88vh;overflow-y:auto;border-radius:12px;padding:16px;position:relative;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.paper:before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(#fff 0 12px,#ddd 12px 14px)}
.paper h3{text-align:center;font-size:26px;color:#2c3e50}
.paper .close{position:absolute;top:8px;right:10px;background:#e74c3c;color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-weight:900}
.charCard{text-align:center;padding:10px}
.charCard .big{font-size:90px}
.charCard h4{font-size:24px;color:#2c3e50}
.selectBtn{background:#2ecc71;color:#fff;border:none;padding:12px 30px;border-radius:30px;font-size:18px;font-weight:900;width:100%;margin-top:8px}
.lockBtn{background:#27ae60;color:#fff;border:none;padding:12px 30px;border-radius:30px;font-size:18px;font-weight:900;width:100%;margin-top:8px}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.mini{width:56px;height:56px;border-radius:12px;background:#fff;border:2px solid #ddd;font-size:28px;cursor:pointer}
.mini.active{border-color:#2ecc71}
.scoreRow{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eee;font-weight:700}
.scoreRow.me{background:#ffe082}
#over{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40;color:#fff;text-align:center;padding:20px}
#over .big{font-size:56px;color:#FFD700;font-weight:900}
.btn{background:#FFD700;color:#000;border:none;padding:14px 22px;border-radius:50px;font-weight:900;width:100%;max-width:320px;margin:6px 0;font-size:16px}
.btn2{background:#fff}
#saveMe{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:45}
#saveBox{background:#fff;padding:22px;border-radius:16px;text-align:center;width:300px}
#saveBox button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;margin:6px 0;font-size:16px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill">SCORE <span id="score">0</span> <small id="mult">x1</small></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">⏸️ <span id="pauseBtn2" onclick="togglePause()">II</span></div></div>
<div id="msg"></div>
<div id="controls"><button onclick="Game.move(-1)">◀️</button><button id="jumpBtn" onclick="Game.jump()">⬆️</button><button onclick="Game.slide()">⬇️</button><button onclick="Game.move(1)">▶️</button></div>

<!-- LOADING -->
<div id="loading"><h1>RUNNING<br><span>RUSH 3D</span><br><small style="font-size:18px">BALI</small></h1><div id="bar"><div id="fill"></div></div><div id="loadPct">0%</div><p style="margin-top:10px;opacity:.8">AZIZ Games • Loading...</p></div>

<!-- MENU -->
<div id="menu">
<div id="menuTop"><button class="topBtn">🔑 <span id="keys">0</span></button><button class="topBtn">🪙 <span id="menuCoins">0</span></button><button class="topBtn" onclick="openNote('settings')">⚙️ Settings</button></div>
<div id="hero"><h2>RUNNING<br><span>RUSH 3D</span></h2><p>🌴 BALI WORLD TOUR 🌴</p><div id="playerFig">🏃</div><p id="charNameLabel">Jake - Runner</p></div>
<div id="press" onclick="Game.start()">PRESS TO PLAY ▶️</div>
<div id="bottomBar"><button id="topRun" onclick="openNote('toprun')">🏆 Top Run</button><button id="meBtn" onclick="openNote('me')">👤 ME</button><button id="shopBtn" onclick="openNote('shop')">🛒 SHOP</button></div>
<p style="font-size:12px;margin-top:8px;opacity:.9">Offline ✅ • Online Leaderboard ✅ • No Lag ✅</p>
</div>

<!-- NOTEBOOK -->
<div class="note" id="note"><div class="paper"><button class="close" onclick="closeNote()">X</button><div id="noteContent"></div></div></div>

<!-- GAME OVER -->
<div id="over"><h2>🚨 PLAYER OUT!</h2><p>Police Caught You!</p><div class="big" id="finalScore">0</div><p>Coins: <b id="finalCoins">0</b></p><button class="btn" onclick="Game.start()">🔄 PLAY AGAIN</button><button class="btn btn2" onclick="goMenu()">🏠 MENU</button><button class="btn" style="background:#3498db;color:#fff" onclick="openNote('toprun')">🏆 TOP RUN</button></div>

<!-- SAVE ME -->
<div id="saveMe"><div id="saveBox"><h3>Save Me!</h3><p>Police is coming!</p><button style="background:#2ecc71;color:#fff" onclick="Game.saveMeFree()">Free! ▶️ Watch</button><button style="background:#3498db;color:#fff" onclick="Game.saveMeKey()">Use 1 🔑 Key (<span id="keyCount2">0</span>)</button><button onclick="closeSave()">No Thanks</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let DB=JSON.parse(localStorage.getItem('rr_bali')||'{}');
if(!DB.coins) DB={coins:6897,keys:0,best:0,runs:0,ownedChars:['Jake'],ownedBoards:['Hoverboard'],char:'Jake',board:'Hoverboard',name:'Naveed'};
function save(){localStorage.setItem('rr_bali',JSON.stringify(DB)); upd();}
function upd(){document.getElementById('menuCoins').innerText=DB.coins; document.getElementById('keys').innerText=DB.keys; document.getElementById('keyCount2').innerText=DB.keys;}
function msg(t){let m=document.getElementById('msg'); m.innerText=t; m.style.display='block'; setTimeout(()=>m.style.display='none',1600);}
const CHARS=[{name:'Jake',emoji:'🏃',price:0},{name:'Tricky',emoji:'👧',price:0},{name:'Yutani',emoji:'👽',price:0},{name:'Lucy',emoji:'👩',price:7000},{name:'Ninja',emoji:'🥷',price:12000},{name:'King',emoji:'👑',price:80000}];
const BOARDS=[{name:'Hoverboard',emoji:'🛹',price:0},{name:'Lumberjack',emoji:'🪵',price:1500},{name:'Superhero',emoji:'🦸',price:1500},{name:'Hot Rod',emoji:'🔥',price:240000}];
let curCharIdx=0, curBoardIdx=0;
function openNote(type){
  let h=document.getElementById('note'); h.style.display='flex'; let c=document.getElementById('noteContent');
  if(type==='toprun'){
    let list=[{n:'Yutani',s:999999},{n:'Spike',s:810312},{n:'Fresh',s:555555},{n:'Tricky',s:345678},{n:'Lucy',s:171110},{n:'Ninja',s:123456},{n:'Naveed',s:DB.best}].sort((a,b)=>b.s-a.s);
    c.innerHTML=`<h3>High Scores</h3><br>${list.map((p,i)=>`<div class="scoreRow ${p.n==='Naveed'?'me':''}"><span>${i+1}. ${p.n}</span><b>${p.s}</b></div>`).join('')}<br><button class="selectBtn" onclick="closeNote();Game.start()">▶️ PLAY</button>`;
  }
  if(type==='me'){
    c.innerHTML=`<h3>ME</h3><div class="charCard"><div class="big">${CHARS.find(x=>x.name===DB.char).emoji}</div><h4>${DB.char}</h4><p>Coins: ${DB.coins} 🪙 | Keys: ${DB.keys} 🔑 | Best: ${DB.best}</p></div><h3>Characters</h3><div class="row">${CHARS.map((ch,i)=>`<button class="mini ${DB.char===ch.name?'active':''}" onclick="selectChar(${i})">${ch.emoji}<br><small style="font-size:9px">${ch.name}</small></button>`).join('')}</div><div id="charAction"></div><h3 style="margin-top:14px">Boards</h3><div class="row">${BOARDS.map((b,i)=>`<button class="mini ${DB.board===b.name?'active':''}" onclick="selectBoard(${i})">${b.emoji}<br><small style="font-size:9px">${b.name}</small></button>`).join('')}</div><div id="boardAction"></div><h3 style="margin-top:14px">Awards</h3><p>🏆 Boost your run - Pick 100 Power-ups - ${Math.min(57,DB.runs*5)}%</p><p>🎉 Own 4 Characters - ${DB.ownedChars.length}/4</p><p>🛹 Own 2 Boards - ${DB.ownedBoards.length}/2</p>`;
    renderCharAction(); renderBoardAction();
  }
  if(type==='shop'){
    c.innerHTML=`<h3>SHOP - Boosts</h3><p style="text-align:center">Coins: ${DB.coins} 🪙 | Keys: ${DB.keys} 🔑</p><br>
    <div class="scoreRow"><span>🛹 Hoverboard - 30s Protect</span><button onclick="buyBoost('Hoverboard',300)">300 🪙</button></div>
    <div class="scoreRow"><span>🎁 Mystery Box</span><button onclick="buyBoost('Mystery Box',500)">500 🪙</button></div>
    <div class="scoreRow"><span>⚡ Score Booster x2</span><button onclick="buyBoost('Score Booster',3000)">3000 🪙</button></div>
    <div class="scoreRow"><span>🚀 Headstart</span><button onclick="buyBoost('Headstart',2000)">2000 🪙</button></div>
    <h3 style="margin-top:14px">Upgrades</h3>
    <div class="scoreRow"><span>🚀 Jetpack - Longer</span><button onclick="buyBoost('Jetpack',500)">500 🪙</button></div>
    <div class="scoreRow"><span>👟 Super Sneakers</span><button onclick="buyBoost('Super Sneakers',500)">500 🪙</button></div>
    <div class="scoreRow"><span>🧲 Coin Magnet</span><button onclick="buyBoost('Coin Magnet',500)">500 🪙</button></div>
    <div class="scoreRow"><span>⭐ Score Multiplier</span><button onclick="buyBoost('Score Multiplier',500)">500 🪙</button></div>`;
  }
  if(type==='settings'){
    c.innerHTML=`<h3>Settings</h3><br><div class="scoreRow"><span>👤 Nickname</span><b>Naveed</b></div><div class="scoreRow"><span>🔊 Sound</span><b>On</b></div><div class="scoreRow"><span>📄 Privacy Policy</span><b>v9.0</b></div><div class="scoreRow"><span>🎮 Version</span><b>RUNNING RUSH 3D v1.0 Bali</b></div><br><button class="selectBtn" onclick="closeNote()">OK</button>`;
  }
}
function closeNote(){document.getElementById('note').style.display='none';}
function selectChar(i){curCharIdx=i; let ch=CHARS[i]; DB.char=ch.name; document.getElementById('playerFig').innerText=ch.emoji; document.getElementById('charNameLabel').innerText=ch.name+' - Runner'; renderCharAction(); save();}
function renderCharAction(){let ch=CHARS[curCharIdx]; let el=document.getElementById('charAction'); if(!el) return; if(DB.ownedChars.includes(ch.name)){ el.innerHTML=`<button class="selectBtn" onclick="selectChar(${curCharIdx})">SELECTED ✅ - ${ch.name}</button>`;} else { el.innerHTML=`<button class="lockBtn" onclick="buyChar(${curCharIdx})">BUY - ${ch.price} 🪙</button>`;}}
function selectBoard(i){curBoardIdx=i; let b=BOARDS[i]; DB.board=b.name; renderBoardAction(); save();}
function renderBoardAction(){let b=BOARDS[curBoardIdx]; let el=document.getElementById('boardAction'); if(!el) return; if(DB.ownedBoards.includes(b.name)){ el.innerHTML=`<button class="selectBtn">SELECTED ✅ - ${b.name}</button>`;} else { el.innerHTML=`<button class="lockBtn" onclick="buyBoard(${curBoardIdx})">BUY - ${b.price} 🪙</button>`;}}
function buyChar(i){let ch=CHARS[i]; if(DB.coins>=ch.price){DB.coins-=ch.price; DB.ownedChars.push(ch.name); save(); msg(ch.name+' Unlocked! 🎉'); openNote('me');} else msg('Not Enough Coins!');}
function buyBoard(i){let b=BOARDS[i]; if(DB.coins>=b.price){DB.coins-=b.price; DB.ownedBoards.push(b.name); save(); msg(b.name+' Unlocked! 🎉'); openNote('me');} else msg('Not Enough Coins!');}
function buyBoost(name,price){if(DB.coins>=price){DB.coins-=price; save(); if(name==='Hoverboard') Game.hover=900; if(name==='Score Booster') Game.mult=2; if(name==='Headstart'){Game.dist=2000; Game.score=2000;} if(name==='Jetpack'){Game.jetpack=600;} if(name==='Coin Magnet') Game.magnet=900; msg(name+' Activated! ⚡');} else msg('Not Enough Coins!');}
function goMenu(){document.getElementById('over').style.display='none'; document.getElementById('hud').style.display='none'; document.getElementById('controls').style.display='none'; document.getElementById('menu').style.display='flex'; upd();}
function closeSave(){document.getElementById('saveMe').style.display='none'; Game.showOver();}
function togglePause(){Game.active=!Game.active;}

// GAME ENGINE - BALI WORLD - SIMPLE & SMOOTH
const Game={
  scene:null,camera:null,renderer:null,player:null,police:null,dog:null,lanes:[-2.5,0,2.5],lane:1,targetX:0,obs:[],coins:[],speed:0.45,score:0,coinN:0,dist:0,active:false,jumpY:0,jumpVel:0,sliding:false,slideT:0,mult:1,magnet:0,hover:0,jetpack:0,lastSpawn:0,
  init(){
    this.scene=new THREE.Scene(); this.scene.background=new THREE.Color(0xffc98a); this.scene.fog=new THREE.Fog(0xffc98a,30,95);
    this.camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,200); this.camera.position.set(0,5.2,7.5);
    this.renderer=new THREE.WebGLRenderer({antialias:true}); this.renderer.setSize(innerWidth,innerHeight);
    document.getElementById('game').appendChild(this.renderer.domElement);
    this.scene.add(new THREE.AmbientLight(0xffffff,0.95));
    let sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(5,10,5); this.scene.add(sun);
    // BALI GROUND - Sandy + Tracks
    for(let i=0;i<25;i++){
      let g=new THREE.Mesh(new THREE.BoxGeometry(10,0.2,10), new THREE.MeshLambertMaterial({color:0xE8B96A})); g.position.set(0,-0.1,-i*10); this.scene.add(g);
      [-2.5,0,2.5].forEach(x=>{let r=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.08,10), new THREE.MeshLambertMaterial({color:0x888888})); r.position.set(x,0.05,-i*10); this.scene.add(r);});
      for(let s=0;s<3;s++){let sl=new THREE.Mesh(new THREE.BoxGeometry(7.5,0.06,0.7), new THREE.MeshLambertMaterial({color:0x6b4a2f})); sl.position.set(0,0,-i*10+s*3); this.scene.add(sl);}
      // Palm Trees + Beach Huts
      if(i%2===0){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,5,6), new THREE.MeshLambertMaterial({color:0x8D6E63})); trunk.position.set(-8,2.5,-i*10); this.scene.add(trunk); let leaves=new THREE.Mesh(new THREE.SphereGeometry(1.8,8,6), new THREE.MeshLambertMaterial({color:0x2ecc71})); leaves.position.set(-8,5.5,-i*10); this.scene.add(leaves);}
      if(i%3===0){let hut=new THREE.Mesh(new THREE.BoxGeometry(3,2.5,3), new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),0.6,0.6)})); hut.position.set(8,1.25,-i*10); this.scene.add(hut);}
    }
    // PLAYER - Simple Cute Runner like Subway Surfers
    let grp=new THREE.Group(); let skin=new THREE.MeshLambertMaterial({color:0xffc9a3}), shirt=new THREE.MeshLambertMaterial({color:0xffffff}), pants=new THREE.MeshLambertMaterial({color:0x3498db});
    let head=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,16),skin); head.position.y=2.2; grp.add(head);
    let cap=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.25,16), new THREE.MeshLambertMaterial({color:0xe74c3c})); cap.position.y=2.6; grp.add(cap);
    let body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.1,0.5),shirt); body.position.y=1.25; grp.add(body);
    let bag=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.7,0.2), new THREE.MeshLambertMaterial({color:0xf1c40f})); bag.position.set(0,1.3,-0.35); grp.add(bag);
    let legL=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.9,0.35),pants); legL.position.set(-0.25,0.45,0); legL.name='legL'; grp.add(legL);
    let legR=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.9,0.35),pants); legR.position.set(0.25,0.45,0); legR.name='legR'; grp.add(legR);
    this.scene.add(grp); this.player=grp;
    // POLICE + DOG
    let pg=new THREE.Group(); let pb=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.1,0.5), new THREE.MeshLambertMaterial({color:0x2980b9})); pb.position.y=1.25; pg.add(pb);
    let ph=new THREE.Mesh(new THREE.SphereGeometry(0.45,16,16),skin); ph.position.y=2.1; pg.add(ph);
    let pcap=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.2,12), new THREE.MeshLambertMaterial({color:0xffffff})); pcap.position.y=2.5; pg.add(pcap);
    pg.position.set(0,0,5.5); this.scene.add(pg); this.police=pg;
    let dg=new THREE.Group(); let db=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.4,0.4), new THREE.MeshLambertMaterial({color:0xffffff})); db.position.y=0.6; dg.add(db);
    let dh=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,10), new THREE.MeshLambertMaterial({color:0xffffff})); dh.position.set(0,0.9,0.4); dg.add(dh);
    dg.position.set(0.9,0,6); this.scene.add(dg); this.dog=dg;
    this.loop();
  },
  spawn(z){
    let t=Math.random(), m;
    if(t<0.38){ // REAL TRAIN - Blue/Red with windows
      m=new THREE.Group();
      let body=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.8,11), new THREE.MeshLambertMaterial({color:Math.random()<0.5?0x2980b9:0xe74c3c})); body.position.y=1.4; m.add(body);
      for(let w=0;w<4;w++){let win=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.8,1.2), new THREE.MeshLambertMaterial({color:0xffffff})); win.position.set(1.21,1.8,-3+w*2.2); m.add(win); let win2=win.clone(); win2.position.x=-1.21; m.add(win2);}
      let front=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.2,0.4), new THREE.MeshLambertMaterial({color:0x222222})); front.position.set(0,1.2,5.6); m.add(front);
      m.position.set(this.lanes[Math.floor(Math.random()*3)],0,z); m.userData.type='train';
    } else if(t<0.68){ // BARRIER - Jump
      m=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.0,0.6), new THREE.MeshLambertMaterial({color:0xe74c3c})); m.position.set(this.lanes[Math.floor(Math.random()*3)],0.5,z); m.userData.type='barrier';
      let stripe=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.3,0.62), new THREE.MeshLambertMaterial({color:0xffffff})); stripe.position.y=0; m.add(stripe);
    } else { // OVERHEAD - Slide
      m=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.0,0.8), new THREE.MeshLambertMaterial({color:0x9b59b6})); m.position.set(this.lanes[Math.floor(Math.random()*3)],2.3,z); m.userData.type='overhead';
    }
    this.scene.add(m); this.obs.pu
